<!DOCTYPE html>
<html>
<head>
  <title>My Weekend</title>
  <style>
    body {
      background-color: lavender;
      font-family: Arial, sans-serif;
    }
    h2 {
      color: darkblue;
      text-align: center;
    }
    ul {
      list-style-type: square;
      border: 2px solid darkblue;
    }
    li {
      font-size: 20px;
      margin-bottom: 10px;
    }
    li:hover {
      background-color: red;
    }
  </style>
</head>
<body>
  <h2>My Week</h2>
  <ul>
    <li>Play with my friends</li>
     <li>Play wordle</li>
     <li>Play freeze tag</li>
    <li>Learn</li>
    <li>Eat</li>
  </ul>

  <h2>Days of The Week</h2>
  <ol>
    <li style="color: green;">Monday</li>
    <li style="color: purple;">Tuesday</li>
    <li style="color: aquamarine;">Wednesday</li>
    <li style="color: black;">Thursday</li>
    <li style="color: aqua;">Friday</li>
  </ol>
</body>
</html>
